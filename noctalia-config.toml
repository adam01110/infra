[accessibility]
ui_scale = 0.80000000000000004

[audio]
enable_overdrive = true

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.94999999999999996
    border_width = 1.0
    capsule = true
    capsule_border = "outline"
    capsule_opacity = 1.0
    capsule_padding = 4.0
    capsule_radius = 0.0
    center = [ "workspaces" ]
    color = "on_surface_variant"
    concave_edge_corners = false
    end = [
        "tray",
        "performance",
        "volume",
        "microphone",
        "bluetooth",
        "network",
        "brightness",
        "battery",
        "caffeine",
        "notifications",
        "clock",
        "control-center"
    ]
    font_weight = 600
    icon_color = "on_surface"
    margin_ends = 0
    padding = 4
    position = "top"
    radius = 0
    scale = 0.84999999999999998
    start = [ "group:system-monitor", "privacy", "lock_keys", "active_window", "media" ]
    thickness = 24
    widget_spacing = 4

        [bar.main.dead_zone.actions]
        right = "none"

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "system-monitor"
        members = [ "cpu-usage", "cpu-temperature", "gpu-usage", "gpu-temperature", "ram", "swap" ]
        opacity = 1.0
        padding = 6.0

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[control_center]
show_shortcut_labels = true
sidebar = "compact"
sidebar_section = "compact"
width = 640

    [control_center.calendar]
    show_week_numbers = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
enabled = false

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.94999999999999996
border_width = 1.0
cross_axis_padding = 4
enabled = true
icon_size = 24
magnification_scale = 1.3
main_axis_padding = 4
margin_edge = 8
radius = 0
reserve_space = false
show_dots = true

[idle]
behavior_order = [ "dim-screen", "dim-keyboard", "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 5.0

    [idle.behavior.dim-keyboard]
    action = "command"
    command = "/nix/store/0rpfr3y6m574ywxhvkp8w7skw0zgnwp0-brightnessctl-0.5.1/bin/brightnessctl -sd rgb:kbd:backlight set 0"
    enabled = true
    resume_command = "/nix/store/0rpfr3y6m574ywxhvkp8w7skw0zgnwp0-brightnessctl-0.5.1/bin/brightnessctl -rd rgb:kbd:backlight"
    timeout = 150.0

    [idle.behavior.dim-screen]
    action = "command"
    command = "/nix/store/0rpfr3y6m574ywxhvkp8w7skw0zgnwp0-brightnessctl-0.5.1/bin/brightnessctl -s set 10"
    enabled = true
    resume_command = "/nix/store/0rpfr3y6m574ywxhvkp8w7skw0zgnwp0-brightnessctl-0.5.1/bin/brightnessctl -r"
    timeout = 150.0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 480.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 330.0

[keybinds]
down = [ "ctrl+j", "down" ]
left = [ "ctrl+h", "left" ]
right = [ "ctrl+l", "right" ]
up = [ "ctrl+k", "up" ]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.40000000000000002
blurred_desktop = true
tint_intensity = 0.20000000000000001

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000002" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 48.0
    box_width = 816.0
    cx = 960.0
    cy = 724.0
    output = "eDP-1"
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background_opacity = 0.0
        bands = 32
        show_when_idle = true

[notification]
background_opacity = 0.94999999999999996
layer = "overlay"

[osd]
background_opacity = 0.94999999999999996

[plugin_settings."kenn/keybind-cheatsheet"]
columns = 4
compositor = "hyprland"
hyprland_parser = "lua"

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true
directory = "/home/adam0/Videos/Recordings"
video_codec = "hevc"

[plugins]
auto_update = true
enabled = [ "adam0/performance", "kenn/keybind-cheatsheet", "noctalia/kaomoji", "noctalia/screen_recorder" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/nix/store/d5ap85sr3f9wazmpfri27ya4vpcdq5h0-noctalia-performance-plugin"
    name = "local"

[shell]
avatar_path = "/home/adam0/.face"
clipboard_confirm_clear_history = false
clipboard_history_max_entries = 64
corner_radius_scale = 0.0
font_family = "JetBrainsMonoNL Nerd Font Propo"
launch_apps_as_systemd_services = true
panel_anchor_bar = "main"
polkit_agent = true
screen_time_enabled = true
setup_wizard_enabled = false

    [shell.animation]
    speed = 2.0

    [shell.launcher.providers.calculator]
    global = false

    [shell.panel]
    borders = true
    control_center_placement = "floating"
    list_item_background = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = true
    transparency_mode = "solid"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    directory = "/home/adam0/Pictures/screenshots"
    filename_pattern = "screenshot_%Y-%m-%dT%H:%M:%S"
    show_cursor = true

    [shell.session]
    grid = false
    show_shortcuts = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        shortcut = "1"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 8.0
        shortcut = "2"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 8.0
        shortcut = "3"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 8.0
        shortcut = "4"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 8.0
        shortcut = "5"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        command = "systemctl reboot --firmware-setup"
        countdown_seconds = 8.0
        glyph = "settings-automation"
        label = "UEFI"
        shortcut = "6"

    [shell.shadow]
    direction = "center"

[system.monitor]
cpu_poll_seconds = 1.0
disk_poll_seconds = 4.0
gpu_poll_seconds = 1.0
memory_poll_seconds = 4.0
network_poll_seconds = 4.0

[theme]
custom_palette = "stylix"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/adam0/Pictures/wallpapers"
transition = [ "honeycomb" ]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 7200
    order = "random"
    recursive = false

    [wallpaper.default]
    path = "/home/adam0/Pictures/wallpapers/98.png"

    [wallpaper.last]
    path = "/home/adam0/Pictures/wallpapers/98.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/adam0/Pictures/wallpapers/98.png"

[weather]
effects = true
enabled = true
unit = "metric"

[widget.active_window]
color = "on_surface_variant"
display = "icon_and_text"
inactive_opacity = 1.0
max_length = 145.0
min_length = 0.0
show_empty_label = true
title_scroll = "on_hover"

[widget.battery]
color = "on_surface_variant"
display_mode = "glyph"
icon_color = "on_surface"
show_label = true

[widget.brightness]
color = "on_surface_variant"
icon_color = "on_surface"
show_label = true

[widget.clock]
color = "primary"
format = "{:%Y-%m-%d %H:%M}"
tooltip_format = "{:%a, %b %d %H:%M}"
vertical_format = """{:%H
%M - %d
%m}"""

[widget.control-center]
custom_image = "/nix/store/ss4h6fag7x83mv94cbhjcgcm9nazb3ks-nixos-icons-0-unstable-2025-06-28/share/icons/hicolor/scalable/apps/nix-snowflake.svg"
custom_image_colorize = true
icon_color = "tertiary"
scale = 1.05

[widget.cpu-temperature]
color = "primary"
show_glyph = true
show_value = false
stat = "cpu_temp"
type = "sysmon"
visualization = "gauge"

    [widget.cpu-temperature.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Btop /nix/store/1r2dkryq028hnvaj6m505a818w184ycg-btop-1.4.7/bin/btop"

[widget.cpu-usage]
color = "primary"
show_glyph = true
show_value = false
stat = "cpu_usage"
type = "sysmon"
visualization = "gauge"

    [widget.cpu-usage.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Btop /nix/store/1r2dkryq028hnvaj6m505a818w184ycg-btop-1.4.7/bin/btop"

[widget.gpu-temperature]
color = "primary"
show_glyph = true
show_value = false
stat = "gpu_temp"
type = "sysmon"
visualization = "gauge"

    [widget.gpu-temperature.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Btop /nix/store/1r2dkryq028hnvaj6m505a818w184ycg-btop-1.4.7/bin/btop"

[widget.gpu-usage]
color = "primary"
show_glyph = true
show_value = false
stat = "gpu_usage"
type = "sysmon"
visualization = "gauge"

    [widget.gpu-usage.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Btop /nix/store/1r2dkryq028hnvaj6m505a818w184ycg-btop-1.4.7/bin/btop"

[widget.lock_keys]
display = "short"
show_caps_lock = true
show_num_lock = true
show_scroll_lock = true

[widget.media]
color = "on_surface_variant"
hide_album_art = false
hide_when_no_media = false
max_length = 145.0
min_length = 0.0
title_scroll = "on_hover"

[widget.microphone]
color = "on_surface_variant"
device = "input"
show_label = true
type = "volume"

    [widget.microphone.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Wiremix /nix/store/4676s2mkq6h817hzna8c36yldcvjhdlh-wiremix-0.11.0/bin/wiremix"

[widget.network]
color = "on_surface_variant"
show_label = true
show_vpn_label = false
vpn_status = "both"

[widget.performance]
color = "on_surface"
type = "adam0/performance:toggle"

[widget.ram]
color = "primary"
show_glyph = true
show_value = false
stat = "ram_used"
type = "sysmon"
visualization = "gauge"

    [widget.ram.actions]
    middle = "exec /nix/store/fkihxwzfbxj8idja8ryx89phkx6pqdwj-xdg-terminal-exec-0.14.3/bin/xdg-terminal-exec --title=Btop /nix/store/1r2dkryq028hnvaj6m505a818w184ycg-btop-1.4.7/bin/btop"

[widget.swap]
color = "primary"
show_glyph = true
